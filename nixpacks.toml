providers = ["python"]

[phases.build]
# --upload-unhashed-files: cloudinary_storage installs its own "collectstatic"
# command (django-cloudinary-storage is listed first in INSTALLED_APPS, and
# Django's command registry resolution means the first app wins name
# collisions). That command's copy_file() is a no-op unless this flag is
# passed or STATICFILES_STORAGE is StaticCloudinaryStorage — without it, no
# files are ever copied into STATIC_ROOT and whitenoise's post-processing
# fails looking for files that were never written.
cmds = ["python manage.py collectstatic --no-input --clear --upload-unhashed-files"]

[start]
cmd = "python manage.py migrate --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
